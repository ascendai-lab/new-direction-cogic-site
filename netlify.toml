[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── Security Headers ───────────────────────────────────────────────────────
# IMPORTANT: The Content-Security-Policy frame-ancestors directive is what
# allows Sanity Studio to embed this site in an iframe for visual editing.
# Without this, you'll get the "Refused to display in a frame" error.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Keep frame-ancestors exactly as is (Sanity visual editing). Never add X-Frame-Options.
    # object-src and base-uri close two script-injection routes without touching normal scripts.
    Content-Security-Policy = "frame-ancestors 'self' https://*.sanity.studio https://sanity.studio; object-src 'none'; base-uri 'self'"

# Self-hosted fonts and converted images never change in place, so let browsers keep them.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
